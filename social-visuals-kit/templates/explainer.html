<!doctype html>
<html><head><meta charset="utf-8"><style>
/* Animated explainer skeleton: each beat is a <section data-beat="id"> shown at its start time from window.TIMELINE.
   Edit the colours/fonts to the brand; keep the beat ids equal to the ids in the voiceover script. */
:root{--bg:#10151F;--fg:#F4F1EC;--muted:#9AA3B2;--accent:#FF8A3D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
section{position:absolute;inset:0;padding:96px 72px;display:flex;flex-direction:column;justify-content:center;gap:36px;opacity:0;transform:translateY(24px);transition:opacity .5s,transform .5s}
section.on{opacity:1;transform:none}
h1{font:600 104px/1.04 Georgia,serif;letter-spacing:-.015em}
h1 b{color:var(--accent);font-weight:inherit}
p{font-size:48px;line-height:1.3;color:var(--muted)}
.typed{font:500 64px/1.2 ui-monospace,Menlo,monospace;border-left:6px solid var(--accent);padding-left:28px;min-height:1.2em}
</style></head><body>
<section data-beat="hook"><h1>The question your <b>audience</b> already asks</h1><p>One line that sets up the story.</p></section>
<section data-beat="show"><div class="typed" id="typed"></div><p>What happens next, in one sentence.</p></section>
<section data-beat="end"><h1>Follow for more</h1><p>@yourhandle</p></section>
<script>
const T = window.TIMELINE || {beats:{hook:{start:0,dur:3},show:{start:3.5,dur:4},end:{start:8,dur:3}},total:11.5};
const secs = [...document.querySelectorAll('section')];
for (const s of secs) {
  const b = T.beats[s.dataset.beat]; if (!b) continue;
  setTimeout(() => { secs.forEach(x => x.classList.remove('on')); s.classList.add('on'); if (s.dataset.beat === 'show') type(); }, b.start * 1000);
}
function type(){ const t='something you would really type', el=document.getElementById('typed'); let i=0;
  const iv=setInterval(()=>{ el.textContent=t.slice(0,++i); if(i>=t.length) clearInterval(iv); }, 70); }
</script></body></html>
